services:
  dev:
    build:
      context: .
      dockerfile: Containerfile
    command: sleep infinity
    init: true
    volumes:
      - ..:/workspaces/innby:cached
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/home/dev/.cache/target
      - ${HOME}/.kube/config:/home/dev/.kube/config:ro
    environment:
      DATABASE_URL: postgres://innby:innby@db:5432/innby
      INNBY_SMTP_URL: smtp://mail:1025
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started

  db:
    image: docker.io/library/postgres:18.6-trixie
    environment:
      POSTGRES_USER: innby
      POSTGRES_PASSWORD: innby
      POSTGRES_DB: innby
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U innby -d innby"]
      interval: 2s
      timeout: 5s
      retries: 15

  mail:
    image: docker.io/axllent/mailpit:v1.33.0
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

volumes:
  cargo-registry:
  cargo-target:
  postgres:
