name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Same versions as .devcontainer/Containerfile.
  JUST_VERSION: 1.59.0
  CARGO_DENY_VERSION: 0.20.2
  CARGO_ZIGBUILD_VERSION: 0.24.0
  SQLX_CLI_VERSION: 0.9.0
  ZIG_VERSION: 0.16.0
  ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
  HELM_VERSION: 4.3.1
  HELM_SHA256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
  KUBECONFORM_VERSION: 0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: docker.io/library/postgres:18.6-trixie
        env:
          POSTGRES_USER: innby
          POSTGRES_PASSWORD: innby
          POSTGRES_DB: innby
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U innby"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://innby:innby@localhost:5432/innby
    steps:
      - uses: actions/checkout@v5
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just@${{ env.JUST_VERSION }},cargo-deny@${{ env.CARGO_DENY_VERSION }}
      - name: Install sqlx-cli
        run: |
          cargo install sqlx-cli@"$SQLX_CLI_VERSION" --locked \
            --no-default-features --features rustls,postgres
      # `test` applies the migrations that `lint` checks the offline query data against.
      - run: just test
      - run: just lint

  chart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: just@${{ env.JUST_VERSION }}
      - name: Install Helm and kubeconform
        run: |
          curl -fsSL -o "$RUNNER_TEMP/helm.tar.gz" \
            "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  $RUNNER_TEMP/helm.tar.gz" | sha256sum -c -
          curl -fsSL -o "$RUNNER_TEMP/kubeconform.tar.gz" \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  $RUNNER_TEMP/kubeconform.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP/bin" --strip-components=1 linux-amd64/helm
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: just chart
      # A release publishes the chart next to the image, as
      # oci://ghcr.io/<owner>/charts/innby, once the image it names is there.
      - name: Check the chart's version is the release's
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version: //p' charts/innby/Chart.yaml)
          [[ "v$version" == "$GITHUB_REF_NAME" ]] \
            || { echo "Chart.yaml has $version, the tag is $GITHUB_REF_NAME" >&2; exit 1; }
      - name: Package the chart
        run: helm package charts/innby --destination "$RUNNER_TEMP/chart"
      - uses: actions/upload-artifact@v4
        with:
          name: chart
          path: ${{ runner.temp }}/chart/*.tgz

  chart-publish:
    needs: [chart, image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chart
          path: chart
      - name: Install Helm
        run: |
          curl -fsSL -o "$RUNNER_TEMP/helm.tar.gz" \
            "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  $RUNNER_TEMP/helm.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C /usr/local/bin --strip-components=1 linux-amd64/helm
      - name: Push the chart to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push chart/innby-*.tgz "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"

  image:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just@${{ env.JUST_VERSION }},cargo-zigbuild@${{ env.CARGO_ZIGBUILD_VERSION }}
      - name: Install zig
        run: |
          curl -fsSL -o "$RUNNER_TEMP/zig.tar.xz" \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          echo "${ZIG_SHA256}  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - name: Build the amd64 and arm64 images as an OCI layout
        id: build
        run: |
          tag="sha-${GITHUB_SHA::12}"
          INNBY_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}" just image "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Smoke-test the binaries
        run: |
          for target in x86_64 aarch64; do
            file "target/$target-unknown-linux-musl/release/innby" | tee /dev/stderr \
              | grep -q "statically linked"
          done
          file target/aarch64-unknown-linux-musl/release/innby | grep -q "ARM aarch64"
          target/x86_64-unknown-linux-musl/release/innby --version
      - name: Push the OCI index to GHCR
        env:
          TAG: ${{ steps.build.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | skopeo login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          also=()
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then also+=(latest); fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then also+=("$GITHUB_REF_NAME"); fi
          INNBY_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}" just push "$TAG" "${also[@]}"
          skopeo inspect --raw "docker://ghcr.io/${GITHUB_REPOSITORY,,}:$TAG" \
            | jq -e '.mediaType == "application/vnd.oci.image.index.v1+json"
                     and ([.manifests[].platform.architecture] | sort) == ["amd64", "arm64"]'

