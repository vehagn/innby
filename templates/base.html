<!doctype html>
<html lang="{{ lang.tag() }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %}</title>
  <link rel="stylesheet" href="{{ crate::paths::STYLESHEET }}">
</head>
<body>
  <header>
    <nav class="lang-switch" aria-label="{{ t.languages }}">
      {% for other in lang.others() %}
      <a href="?lang={{ other.code() }}" hreflang="{{ other.tag() }}" lang="{{ other.tag() }}">{{ other.messages().language_name }}</a>
      {% endfor %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <a href="{{ lang.privacy() }}">{{ t.privacy_link }}</a>
  </footer>
</body>
</html>
