<!doctype html>
{% let theme = crate::theme::Theme::current() %}
{% let theme_choices = crate::paths::theme_choices(lang) %}
<html lang="{{ lang.tag() }}" data-theme="{{ theme.code() }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %}</title>
  <link rel="stylesheet" href="{{ crate::http::stylesheet_link() }}">
</head>
<body>
  <header>
    <a class="brand" href="{{ lang.home() }}">Innby</a>
    {% include "_header_controls.html" %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <a href="{{ lang.privacy() }}">{{ t.privacy_link }}</a>
  </footer>
</body>
</html>
