<!doctype html>
<html lang="{{ lang.tag() }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %}</title>
  <link rel="stylesheet" href="{{ crate::web::stylesheet_link() }}">
</head>
<body>
  <header>
    <nav class="lang-menu" aria-label="{{ t.languages }}">
      <details>
        <summary title="{{ t.languages }}">
          <svg class="globe" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3"/></svg>
          <span class="badge" aria-hidden="true">{{ lang.badge() }}</span>
          <span class="visually-hidden">{{ t.languages }}: {{ t.language_name }}</span>
        </summary>
        <ul>
          {% for other in lang.others() %}
          <li><a href="?lang={{ other.code() }}" hreflang="{{ other.tag() }}" lang="{{ other.tag() }}"><span class="badge" aria-hidden="true">{{ other.badge() }}</span>{{ other.messages().language_name }}</a></li>
          {% endfor %}
        </ul>
      </details>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <a href="{{ lang.privacy() }}">{{ t.privacy_link }}</a>
  </footer>
</body>
</html>
