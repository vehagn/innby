<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · fest admin</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="admin">
  <header>
    <a href="/">Guests</a>
  </header>
  <main>
    {% if let Some(error) = error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
