{#- A lone tab would only repeat the heading below it. #}
{% if tabs.len() > 1 %}
<nav class="tabs" aria-label="Innby {{ crate::admin::lang::text().admin }}">
  {% for tab in tabs %}
  <a href="{{ tab.href }}"{% if tab.current %} aria-current="page"{% endif %}>{{ tab.label }}</a>
  {% endfor %}
</nav>
{% endif %}
