<div class="hero">
  <h1 class="title"><span class="title-emoji" aria-hidden="true">🎉</span> <span class="title-text">{{ event.title }}<span class="glitch" aria-hidden="true">{{ event.title }}</span><span class="glitch" aria-hidden="true">{{ event.title }}</span></span> <span class="title-emoji" aria-hidden="true">🥂</span></h1>
  <dl class="facts">
    <div>
      <dt>{{ t.when }}</dt>
      <dd><time datetime="{{ event.starts_at_iso }}">{{ event.when }}</time></dd>
    </div>
    {% if !event.location.is_empty() %}
    <div>
      <dt>{{ t.place }}</dt>
      <dd>{{ event.location }}</dd>
    </div>
    {% endif %}
  </dl>
</div>
<p class="description">{{ event.description }}</p>
