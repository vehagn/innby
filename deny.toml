[advisories]
ignore = [
  # basic-toml is unmaintained, but only askama's derive macro uses it, at build time,
  # to read askama.toml. Drop this once askama switches parsers.
  { id = "RUSTSEC-2026-0374", reason = "build-time only, via askama_derive" },
]

[licenses]
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  # webpki-roots: the Mozilla CA list compiled into the binary.
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
private = { ignore = true }

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
