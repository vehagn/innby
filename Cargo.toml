[package]
name = "innby"
version = "0.5.3"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
askama = "0.16.1"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde", "unstable-locales"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
hmac = "0.12.1"
hyper = { version = "1.12.0", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.21", features = ["http1", "server", "server-graceful", "service", "tokio"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", default-features = false, features = [
  "chrono",
  "derive",
  "json",
  "macros",
  "migrate",
  "postgres",
  "runtime-tokio",
  "tls-rustls-ring-webpki",
  "uuid",
] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["cors", "set-header", "timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.29.0", features = ["serde"] }
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "display", "serde"] }
# Single sign-on: the HTTP client, signatures and URLs, all already in the build through
# sqlx and lettre. ring rather than aws-lc-rs, as for those.
http-body-util = "0.1.5"
ring = "0.17.14"
subtle = "2.6.1"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["logging", "ring", "tls12"] }
url = "2.5.8"
webpki-roots = "1.0.11"
# The allocator: musl's own keeps what it frees, so a pod only ever grows. libmimalloc-sys
# for `mi_option_set`, which the mimalloc crate doesn't expose.
mimalloc = { version = "0.1.52", default-features = false }
libmimalloc-sys = { version = "0.1.49", default-features = false, features = ["extended"] }
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
# Reads pages in the end-to-end tests, as a browser would.
html5gum = "0.9.0"

# Password hashing is slow unoptimised, and tests and `just up` hash at full strength.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
