apiVersion: apps/v1
kind: Deployment
metadata:
  name: innby-web
  labels:
    app.kubernetes.io/name: innby
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: innby
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: innby
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Migrations take an advisory lock, so replicas starting together are fine.
        - name: migrate
          image: ghcr.io/vehagn/innby
          args: [ migrate ]
          # Only for the INNBY_EVENT_* settings, which it reads once (see config.env).
          envFrom:
            - configMapRef: { name: innby-config }
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: innby-postgres-app, key: uri }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ ALL ]
      containers:
        - name: innby
          image: ghcr.io/vehagn/innby
          args: [ serve ]
          envFrom:
            - configMapRef: { name: innby-config }
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: innby-postgres-app, key: uri }
            - name: INNBY_LINK_KEY
              valueFrom:
                secretKeyRef: { name: innby, key: INNBY_LINK_KEY }
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ ALL ]
---
apiVersion: v1
kind: Service
metadata:
  name: innby-web
spec:
  selector:
    app.kubernetes.io/name: innby
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: innby-web
spec:
  parentRefs:
    - { name: external, namespace: gateway }
    - { name: internal, namespace: gateway }
  hostnames: [ "fest.stonegarden.dev" ]
  rules:
    - backendRefs: [ { name: innby-web, port: 80 } ]
      matches:
        - path: { type: PathPrefix, value: / }
