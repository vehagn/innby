# Each workload may reach only what it needs. Cilium allows kubelet probes from the
# node regardless.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: innby-web
spec:
  endpointSelector:
    matchLabels: { app.kubernetes.io/name: innby, app.kubernetes.io/component: web }
  ingress:
    # Traffic from the Gateway API listeners (external and internal).
    - fromEntities: [ ingress ]
      toPorts: [ { ports: [ { port: "8080", protocol: TCP } ] } ]
  egress:
    - toEndpoints: [ { matchLabels: { cnpg.io/cluster: innby-postgres } } ]
      toPorts: [ { ports: [ { port: "5432", protocol: TCP } ] } ]
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts: [ { ports: [ { port: "53", protocol: ANY } ] } ]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: innby-admin
spec:
  endpointSelector:
    matchLabels: { app.kubernetes.io/name: innby, app.kubernetes.io/component: admin }
  ingress:
    - fromEntities: [ ingress ]
      toPorts: [ { ports: [ { port: "8081", protocol: TCP } ] } ]
  egress:
    - toEndpoints: [ { matchLabels: { cnpg.io/cluster: innby-postgres } } ]
      toPorts: [ { ports: [ { port: "5432", protocol: TCP } ] } ]
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports: [ { port: "53", protocol: ANY } ]
          # Lets Cilium learn the addresses behind the FQDN rule below.
          rules: { dns: [ { matchPattern: "*" } ] }
    # Single sign-on: discovery, keys, tokens and userinfo at INNBY_OIDC_ISSUER.
    - toFQDNs: [ { matchName: authelia.stonegarden.dev } ]
      toPorts: [ { ports: [ { port: "443", protocol: TCP } ] } ]
---
# The only workload that leaves the cluster, and only to MailerSend.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: innby-mailer
spec:
  endpointSelector:
    matchLabels: { app.kubernetes.io/name: innby, app.kubernetes.io/component: mailer }
  # An empty rule allows nothing but turns on default deny for ingress.
  ingress: [ { } ]
  egress:
    - toEndpoints: [ { matchLabels: { cnpg.io/cluster: innby-postgres } } ]
      toPorts: [ { ports: [ { port: "5432", protocol: TCP } ] } ]
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports: [ { port: "53", protocol: ANY } ]
          # Lets Cilium learn the addresses behind the FQDN rule below.
          rules: { dns: [ { matchPattern: "*" } ] }
    - toFQDNs: [ { matchName: smtp.mailersend.net } ]
      toPorts: [ { ports: [ { port: "587", protocol: TCP } ] } ]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: innby-janitor
spec:
  endpointSelector:
    matchLabels: { app.kubernetes.io/name: innby, app.kubernetes.io/component: janitor }
  # An empty rule allows nothing but turns on default deny for ingress.
  ingress: [ { } ]
  egress:
    - toEndpoints: [ { matchLabels: { cnpg.io/cluster: innby-postgres } } ]
      toPorts: [ { ports: [ { port: "5432", protocol: TCP } ] } ]
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts: [ { ports: [ { port: "53", protocol: ANY } ] } ]
---
# Postgres accepts the Innby workloads and the CloudNativePG operator. Its own egress
# (to the API server) is left alone.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: innby-postgres
spec:
  endpointSelector:
    matchLabels: { cnpg.io/cluster: innby-postgres }
  ingress:
    - fromEndpoints: [ { matchLabels: { app.kubernetes.io/name: innby } } ]
      toPorts: [ { ports: [ { port: "5432", protocol: TCP } ] } ]
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: cnpg-system }
      toPorts:
        - ports: [ { port: "8000", protocol: TCP }, { port: "5432", protocol: TCP } ]
