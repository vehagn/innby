apiVersion: apps/v1
kind: Deployment
metadata:
  name: innby-mailer
  labels:
    app.kubernetes.io/name: innby
    app.kubernetes.io/component: mailer
spec:
  replicas: 1
  # One sender is plenty, and a restart shouldn't overlap with a second one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: innby
      app.kubernetes.io/component: mailer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: innby
        app.kubernetes.io/component: mailer
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: innby
          image: ghcr.io/vehagn/innby
          args: [ mailer ]
          envFrom:
            - configMapRef: { name: innby-config }
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: innby-postgres-app, key: uri }
            - name: INNBY_LINK_KEY
              valueFrom:
                secretKeyRef: { name: innby, key: INNBY_LINK_KEY }
            - name: INNBY_SMTP_USER
              valueFrom:
                secretKeyRef: { name: innby, key: INNBY_SMTP_USER }
            - name: INNBY_SMTP_PASSWORD
              valueFrom:
                secretKeyRef: { name: innby, key: INNBY_SMTP_PASSWORD }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ ALL ]
