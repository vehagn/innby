apiVersion: apps/v1
kind: Deployment
metadata:
  name: innby-admin
  labels:
    app.kubernetes.io/name: innby
    app.kubernetes.io/component: admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: innby
      app.kubernetes.io/component: admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: innby
        app.kubernetes.io/component: admin
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: innby
          image: ghcr.io/vehagn/innby
          args: [ admin ]
          envFrom:
            - configMapRef: { name: innby-config }
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: innby-postgres-app, key: uri }
            - name: INNBY_LINK_KEY
              valueFrom:
                secretKeyRef: { name: innby, key: INNBY_LINK_KEY }
            - name: INNBY_ADMIN_PASSWORD_HASH
              valueFrom:
                secretKeyRef: { name: innby, key: INNBY_ADMIN_PASSWORD_HASH }
            - name: INNBY_ADMIN_JWT_SECRET
              valueFrom:
                secretKeyRef: { name: innby, key: INNBY_ADMIN_JWT_SECRET }
          ports:
            - name: http
              containerPort: 8081
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ ALL ]
---
apiVersion: v1
kind: Service
metadata:
  name: innby-admin
spec:
  selector:
    app.kubernetes.io/name: innby
    app.kubernetes.io/component: admin
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Internal gateway only: the admin UI is never reachable from the internet.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: innby-admin
spec:
  parentRefs:
    - { name: internal, namespace: gateway }
  hostnames: [ "fest-admin.stonegarden.dev" ]
  rules:
    - backendRefs: [ { name: innby-admin, port: 80 } ]
      matches:
        - path: { type: PathPrefix, value: / }
