apiVersion: batch/v1
kind: CronJob
metadata:
  name: fest-janitor
  labels:
    app.kubernetes.io/name: fest
    app.kubernetes.io/component: janitor
spec:
  schedule: "17 * * * *"
  timeZone: Europe/Oslo
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: fest
            app.kubernetes.io/component: janitor
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: fest
              image: ghcr.io/vehagn/fest
              args: [ janitor ]
              envFrom:
                - configMapRef: { name: fest-config }
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef: { name: fest-postgres-app, key: uri }
              resources:
                requests: { cpu: 10m, memory: 16Mi }
                limits: { memory: 64Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ ALL ]
