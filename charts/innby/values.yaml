# Innby's settings. The ones without a default must be set; `helm install` says which.
# Every INNBY_* setting is described in the app's .env.example.

image:
  repository: ghcr.io/vehagn/innby
  # Defaults to v{appVersion}, the release the chart came with.
  tag: ""
  # Pins the image by digest, e.g. sha256:…, over the tag.
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Where guests reach the site, INNBY_BASE_URL. Links in mails and QR codes point here.
siteUrl: ""

# The data controller named in the privacy notice: you.
controller:
  name: ""
  email: ""
  # The service mail is sent through, which handles guests' addresses for you, as the
  # privacy notice names it: the company and its country, e.g. "MailerSend (MailerSend
  # UAB, Lithuania)". Empty, the notice says mail goes through your own server.
  mailProcessor: ""
  # Where the site runs, if a provider's servers hold its data: the company and its
  # country, e.g. "Hetzner Online GmbH, Germany". Empty, the notice says your own server.
  hosting: ""
  # The data protection authority guests may complain to, and its https:// page, e.g.
  # Datatilsynet and https://www.datatilsynet.no/en/. Empty, the notice says the one
  # where the guest or you are.
  authority:
    name: ""
    url: ""

# Postgres 18 or later, in one of three ways: a CloudNativePG cluster, a Secret holding a
# postgres:// URL, or the URL itself.
database:
  cnpg:
    # The name of a CloudNativePG Cluster in the release's namespace. Innby reads the
    # {cluster}-app Secret the operator makes, and the network policies let the
    # workloads reach the cluster's pods. The chart doesn't make the Cluster.
    cluster: ""
  # A Secret holding a postgres:// URL.
  existingSecret: ""
  existingSecretKey: uri
  # Or the URL itself, which goes into the chart's Secret.
  url: ""

# Secrets. Either name a Secret you made (with SealedSecrets, External Secrets, …) holding
# these keys, or give the values here and the chart makes one. Values in a values file
# end up in Helm's release history, so prefer existingSecret.
#   INNBY_LINK_KEY             signs guests' links: `openssl rand -base64 32`
#   INNBY_ADMIN_JWT_SECRET     signs the admin's logins: `openssl rand -base64 32`
#   INNBY_ADMIN_PASSWORD_HASH  the built-in admin user's password: `innby hash-password`;
#                              leave it out to log in only through OIDC
#   INNBY_ADMIN_USERS          more users with a password, each name:role:hash, apart by
#                              spaces or lines; the role is admin, creator, editor,
#                              organiser, viewer, or none for only the events an
#                              admin gives them a role for
#   INNBY_OIDC_CLIENT_SECRET   with oidc.issuer
#   INNBY_SMTP_USER, INNBY_SMTP_PASSWORD
secrets:
  existingSecret: ""
  linkKey: ""
  adminJwtSecret: ""
  adminPasswordHash: ""
  adminUsers: ""
  oidcClientSecret: ""
  smtpUser: ""
  smtpPassword: ""

# Takes the client's address from the X-Forwarded-For entry the proxy in front appends,
# for the rate limits: the site's sign-ups and mail, and the admin's login attempts,
# which are counted per address. Only with a proxy every request comes through; without
# it, everyone behind the proxy shares one address and one limit.
trustForwarded: false

# Further INNBY_* settings and RUST_LOG, as name: value, for every workload. Probes are
# logged only when they fail; RUST_LOG: info,innby::http=debug logs them all.
extraConfig: {}
#  INNBY_TRUST_FORWARDED: "true"

# Minigames on the guests' pages (docs/games.md). With enabled, the chart runs the example
# games' image, Reaction, Snake, Tetris and Balloon, on a hostname of its own, and lists
# them for Innby. Or run games of your own, list them in extraConfig (INNBY_GAMES_URL,
# INNBY_GAMES), and open the internal port to their servers with internal below.
games:
  enabled: false
  # Where guests reach the games: a hostname of its own, never the site's, e.g.
  # https://games.example.com. The routes and Ingresses above serve it too.
  url: ""
  # INNBY_GAMES: the games guests are offered, the image's by default. Hosts turn them
  # on per event in the admin UI.
  list: "reaction:time:Reaction; snake:points:server:Snake; tetris:points:server:Tetris; balloon:points:server:Balloon"
  image:
    repository: ghcr.io/vehagn/innby-games
    # Defaults to Innby's image's tag.
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  # Rounds are kept in the server's memory, so one replica.
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
  # Each game server's key, from `innby game-key {id}`, as INNBY_GAME_KEY_{ID}: a Secret
  # you made, or the keys here, by game, which go into one the chart makes. A game
  # without its key plays, but keeps no scores.
  keys:
    existingSecret: ""
    values: {}
    #  snake: …
  # The site's internal port, 8083, for games' servers to send scores to, through the
  # {release}-internal Service. On with enabled, for the games' pods; for servers of
  # your own, turn it on and name their pods' labels, which alone the network policies
  # let in, from this namespace.
  internal:
    enabled: false
    podLabels: {}
    #  app.kubernetes.io/name: my-games

web:
  replicaCount: 2
  service:
    type: ClusterIP
    port: 80
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { memory: 64Mi }

admin:
  enabled: true
  # Where hosts reach the admin UI: under a path of the site's hostname, or on a hostname
  # of its own, e.g. https://fest-admin.example.com. Defaults to {siteUrl}/admin.
  url: ""
  # The built-in user, when secrets has a password hash.
  user: admin
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    # A login's argon2 check takes 19 MiB on its own, and the biggest pages
    # some more: `just bench` checks the peak stays 8 MiB under this.
    limits: { memory: 96Mi }

# Single sign-on to the admin UI through an OpenID Connect provider, such as Authelia.
# Register {admin.url}/login/oidc/callback with it. Hosts' roles (admin, creator, editor,
# organiser, viewer) come from the claim named in rolesClaim.
oidc:
  issuer: ""
  clientId: innby
  # The name on the login button.
  name: ""
  scopes: ""
  rolesClaim: ""

mailer:
  enabled: true
  # The sender, e.g. "Innby <fest@example.com>".
  from: ""
  # smtp://host:587?tls=required (STARTTLS) or smtps://host:465.
  smtpUrl: ""
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { memory: 64Mi }

# Deletes what the retention rules say is due.
janitor:
  schedule: "17 * * * *"
  # The schedule's time zone, e.g. Europe/Oslo; the cluster's when empty.
  timeZone: ""
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { memory: 64Mi }

# Anonymous metrics for Prometheus: requests by route pattern and how long they took,
# mail sent and failed, the outbox, database connections and memory. Nothing per event
# or guest. The site, the admin UI and the mailer each serve them at /metrics on this
# port, which no route or Ingress reaches; the network policies below say who may.
metrics:
  enabled: false
  port: 9090
  # A ServiceMonitor scraping all three, through a ClusterIP Service each, for a cluster
  # with the Prometheus Operator's CRDs.
  serviceMonitor:
    enabled: false
    # e.g. 30s; Prometheus's own when empty.
    interval: ""
    # The labels your Prometheus picks ServiceMonitors by, e.g. { release: prometheus }.
    labels: {}
  # A dashboard of them, dashboards/innby.json, for a cluster with the Grafana Operator's
  # CRDs. The JSON imports into any Grafana by hand too.
  grafanaDashboard:
    enabled: false
    # Which Grafana instances get it, e.g. { matchLabels: { app: grafana } }.
    instanceSelector: {}
    # Grafana in another namespace takes it only with this.
    allowCrossNamespaceImport: true
    folder: Innby
    # How often the operator checks the dashboard is as here, e.g. 10m.
    resyncPeriod: ""

# Gateway API routes, for a cluster with its CRDs: one for the site's hostname and one for
# the admin UI's path or hostname. Gateways pick the longest matching path, so /admin can
# share the site's hostname.
httpRoute:
  enabled: false
  annotations: {}
  # e.g. [{ name: external, namespace: gateway }]
  parentRefs: []
  admin:
    # Another gateway for the admin UI, such as an internal one; parentRefs when empty.
    parentRefs: []

# Ingresses, if you'd rather: the same two, for the site and the admin UI.
ingress:
  enabled: false
  className: ""
  annotations: {}
  # e.g. [{ secretName: innby-tls, hosts: [fest.example.com] }]
  tls: []
  admin:
    # The admin UI's own class, annotations and TLS; the ones above when empty (TLS only
    # when the admin UI shares the site's hostname).
    className: ""
    annotations: {}
    tls: []

# Kubernetes NetworkPolicies that let each workload reach only what it needs. Standard
# NetworkPolicy can't name hosts, so the database, SMTP and OIDC provider are reached on
# their ports anywhere unless you narrow them with peers.
networkPolicy:
  enabled: false
  # Who may reach the site and the admin UI, e.g. your ingress controller's namespace.
  # Anyone when empty.
  ingressFrom: []
  admin:
    ingressFrom: []
  # Who may scrape the metrics, e.g. Prometheus's namespace. Anyone when empty.
  metricsFrom: []
  # Peers for Postgres, e.g. [{ podSelector: { matchLabels: { cnpg.io/cluster: db } } }].
  databasePeers: []
  databasePort: 5432
  smtpPort: 587

# CiliumNetworkPolicies instead, for a cluster with Cilium's CRDs. They can name hosts:
# the mailer may reach only the SMTP server in mailer.smtpUrl, and the admin UI only the
# OIDC provider in oidc.issuer. Use these or networkPolicy, not both.
ciliumNetworkPolicy:
  enabled: false
  # Who may reach the site and the admin UI: Cilium entities, such as ingress for
  # Cilium's own Gateway API and Ingress, and endpoint selectors.
  ingressFromEntities: [ingress]
  ingressFromEndpoints: []
  admin:
    # The admin UI's own; the ones above when both are empty.
    ingressFromEntities: []
    ingressFromEndpoints: []
  # Who may scrape the metrics, as endpoint selectors, e.g. [{ matchLabels:
  # { k8s:io.kubernetes.pod.namespace: monitoring } }]; anything in the cluster when empty.
  metricsFromEndpoints: []
  # Postgres, as endpoint selectors, e.g. [{ matchLabels: { cnpg.io/cluster: db } }];
  # its port anywhere when empty.
  databaseEndpoints: []
  databasePort: 5432
  # A policy for the pods of database.cnpg.cluster too, which the chart doesn't make:
  # they accept Postgres only from Innby, the cluster's own instances and the operator.
  cnpg:
    enabled: false
    # Where the CloudNativePG operator runs.
    operatorNamespace: cnpg-system
  # The cluster's DNS, whose answers Cilium reads to learn the hosts' addresses.
  dnsEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
