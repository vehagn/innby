{{- if .Values.networkPolicy.enabled }}
{{- $policy := .Values.networkPolicy }}
{{- $web := dict "root" . "component" "web" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "innby.component" $web }}
  labels:
    {{- include "innby.labels" $web | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "innby.selectorLabels" $web | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - {{- with $policy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      ports:
        - { port: 8080, protocol: TCP }
    {{- if include "innby.gamesInternal" . }}
    # Games' servers, sending scores.
    - from:
        - podSelector:
            matchLabels:
              {{- include "innby.gamesPodLabels" . | nindent 14 }}
      ports:
        - { port: 8083, protocol: TCP }
    {{- end }}
    {{- include "innby.metricsIngress" . | nindent 4 }}
  egress:
    {{- include "innby.egressBasics" . | nindent 4 }}
{{- if .Values.admin.enabled }}
{{- $admin := dict "root" . "component" "admin" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "innby.component" $admin }}
  labels:
    {{- include "innby.labels" $admin | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "innby.selectorLabels" $admin | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - {{- with (default $policy.ingressFrom $policy.admin.ingressFrom) }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      ports:
        - { port: 8081, protocol: TCP }
    {{- include "innby.metricsIngress" . | nindent 4 }}
  egress:
    {{- include "innby.egressBasics" . | nindent 4 }}
    {{- if .Values.oidc.issuer }}
    # The OIDC provider: discovery, keys, tokens and userinfo.
    - ports:
        - { port: {{ include "innby.oidcPort" . }}, protocol: TCP }
    {{- end }}
{{- end }}
{{- if .Values.mailer.enabled }}
{{- $mailer := dict "root" . "component" "mailer" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "innby.component" $mailer }}
  labels:
    {{- include "innby.labels" $mailer | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "innby.selectorLabels" $mailer | nindent 6 }}
  policyTypes: [Ingress, Egress]
  {{- if .Values.metrics.enabled }}
  ingress:
    {{- include "innby.metricsIngress" . | nindent 4 }}
  {{- end }}
  egress:
    {{- include "innby.egressBasics" . | nindent 4 }}
    - ports:
        - { port: {{ $policy.smtpPort }}, protocol: TCP }
{{- end }}
{{- $janitor := dict "root" . "component" "janitor" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "innby.component" $janitor }}
  labels:
    {{- include "innby.labels" $janitor | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "innby.selectorLabels" $janitor | nindent 6 }}
  policyTypes: [Ingress, Egress]
  egress:
    {{- include "innby.egressBasics" . | nindent 4 }}
{{- if .Values.games.enabled }}
{{- $games := dict "root" . "component" "games" }}
---
# The games: guests reach their pages, and they reach only the site's internal port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "innby.component" $games }}
  labels:
    {{- include "innby.labels" $games | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "innby.selectorLabels" $games | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - {{- with $policy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      ports:
        - { port: 8082, protocol: TCP }
  egress:
    - ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - to:
        - podSelector:
            matchLabels:
              {{- include "innby.selectorLabels" (dict "root" . "component" "web") | nindent 14 }}
      ports:
        - { port: 8083, protocol: TCP }
{{- end }}
{{- end }}
