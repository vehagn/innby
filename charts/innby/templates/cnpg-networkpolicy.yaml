{{- /* The chart's own Cluster accepts Innby's pods, its own instances and the operator. */}}
{{- $cnpg := .Values.database.cnpg }}
{{- if $cnpg.create }}
{{- $ctx := dict "root" . "component" "postgres" }}
{{- $cluster := include "innby.cnpgCluster" . }}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "innby.component" $ctx }}
  labels:
    {{- include "innby.labels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels: { cnpg.io/cluster: {{ $cluster }} }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "innby.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
        - podSelector:
            matchLabels: { cnpg.io/cluster: {{ $cluster }} }
      ports:
        - { port: 5432, protocol: TCP }
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ $cnpg.operatorNamespace }} }
      ports:
        - { port: 5432, protocol: TCP }
        - { port: 8000, protocol: TCP }
{{- end }}
{{- if .Values.ciliumNetworkPolicy.enabled }}
{{- if .Values.networkPolicy.enabled }}
---
{{- end }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "innby.component" $ctx }}
  labels:
    {{- include "innby.labels" $ctx | nindent 4 }}
spec:
  endpointSelector:
    matchLabels: { cnpg.io/cluster: {{ $cluster }} }
  # Its egress, to the API server, is the operator's business.
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: {{ include "innby.name" . }}
            app.kubernetes.io/instance: {{ .Release.Name }}
        - matchLabels: { cnpg.io/cluster: {{ $cluster }} }
      toPorts:
        - ports: [{ port: "5432", protocol: TCP }]
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: {{ $cnpg.operatorNamespace }} }
      toPorts:
        - ports: [{ port: "8000", protocol: TCP }, { port: "5432", protocol: TCP }]
{{- end }}
{{- end }}
