{{- $secrets := .Values.secrets }}
{{- if not $secrets.existingSecret }}
{{- if and .Values.admin.enabled (not $secrets.adminPasswordHash) (not $secrets.adminUsers) (not .Values.oidc.issuer) }}
{{- fail "nobody could log in to the admin UI: set secrets.adminPasswordHash, secrets.adminUsers, oidc.issuer, or more than one" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "innby.fullname" . }}
  labels:
    {{- include "innby.labels" (dict "root" . "component" "secret") | nindent 4 }}
type: Opaque
stringData:
  INNBY_LINK_KEY: {{ required "secrets.linkKey (or secrets.existingSecret): `openssl rand -base64 32`" $secrets.linkKey | quote }}
  {{- if .Values.admin.enabled }}
  INNBY_ADMIN_JWT_SECRET: {{ required "secrets.adminJwtSecret: `openssl rand -base64 32`" $secrets.adminJwtSecret | quote }}
  {{- end }}
  {{- with $secrets.adminPasswordHash }}
  INNBY_ADMIN_PASSWORD_HASH: {{ . | quote }}
  {{- end }}
  {{- with $secrets.adminUsers }}
  INNBY_ADMIN_USERS: {{ . | quote }}
  {{- end }}
  {{- if .Values.oidc.issuer }}
  INNBY_OIDC_CLIENT_SECRET: {{ required "secrets.oidcClientSecret, for oidc.issuer" $secrets.oidcClientSecret | quote }}
  {{- end }}
  {{- with $secrets.smtpUser }}
  INNBY_SMTP_USER: {{ . | quote }}
  {{- end }}
  {{- with $secrets.smtpPassword }}
  INNBY_SMTP_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- if and .Values.database.url (not .Values.database.existingSecret) }}
  DATABASE_URL: {{ .Values.database.url | quote }}
  {{- end }}
{{- else if .Values.database.url }}
{{- if not .Values.database.existingSecret }}
{{- fail "database.url goes into the chart's Secret, which secrets.existingSecret replaces: put the URL in a Secret too, and name it in database.existingSecret" }}
{{- end }}
{{- end }}
