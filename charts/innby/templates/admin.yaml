{{- if .Values.admin.enabled }}
{{- $ctx := dict "root" . "component" "admin" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "innby.component" $ctx }}
  labels:
    {{- include "innby.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ .Values.admin.replicaCount }}
  selector:
    matchLabels:
      {{- include "innby.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      {{- include "innby.podMetadata" $ctx | nindent 6 }}
    spec:
      {{- include "innby.podSpec" . | nindent 6 }}
      containers:
        - name: innby
          {{- include "innby.container" . | nindent 10 }}
          args: [admin]
          env:
            {{- include "innby.databaseEnv" . | nindent 12 }}
            {{- include "innby.secretEnv" (dict "root" . "key" "INNBY_LINK_KEY") | nindent 12 }}
            {{- include "innby.secretEnv" (dict "root" . "key" "INNBY_ADMIN_JWT_SECRET") | nindent 12 }}
            # Each way of logging in is on when its secret is there.
            {{- include "innby.secretEnv" (dict "root" . "key" "INNBY_ADMIN_PASSWORD_HASH" "optional" true) | nindent 12 }}
            {{- include "innby.secretEnv" (dict "root" . "key" "INNBY_OIDC_CLIENT_SECRET" "optional" true) | nindent 12 }}
          ports:
            - name: http
              containerPort: 8081
            {{- include "innby.metricsPort" . | nindent 12 }}
          # The probes are at the root even when the pages are under a path.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            {{- toYaml .Values.admin.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "innby.component" $ctx }}
  labels:
    {{- include "innby.labels" $ctx | nindent 4 }}
spec:
  type: {{ .Values.admin.service.type }}
  selector:
    {{- include "innby.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.admin.service.port }}
      targetPort: http
{{- end }}
