{{- if .Values.httpRoute.enabled }}
{{- $route := .Values.httpRoute }}
{{- if not $route.parentRefs }}
{{- fail "httpRoute.parentRefs: the Gateway to attach to, e.g. [{ name: external, namespace: gateway }]" }}
{{- end }}
{{- $web := dict "root" . "component" "web" }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "innby.component" $web }}
  labels:
    {{- include "innby.labels" $web | nindent 4 }}
  {{- with $route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml $route.parentRefs | nindent 4 }}
  hostnames:
    - {{ (urlParse (include "innby.siteUrl" .)).hostname | quote }}
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: {{ include "innby.component" $web }}
          port: {{ .Values.web.service.port }}
{{- if .Values.admin.enabled }}
{{- $admin := dict "root" . "component" "admin" }}
---
# The admin UI's path or hostname. On the site's hostname, its longer path wins.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "innby.component" $admin }}
  labels:
    {{- include "innby.labels" $admin | nindent 4 }}
  {{- with $route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml (default $route.parentRefs $route.admin.parentRefs) | nindent 4 }}
  hostnames:
    - {{ (urlParse (include "innby.adminUrl" .)).hostname | quote }}
  rules:
    - matches:
        - path: { type: PathPrefix, value: {{ include "innby.adminPath" . | quote }} }
      backendRefs:
        - name: {{ include "innby.component" $admin }}
          port: {{ .Values.admin.service.port }}
{{- end }}
{{- if .Values.games.enabled }}
{{- $games := dict "root" . "component" "games" }}
---
# The games, on their own hostname.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "innby.component" $games }}
  labels:
    {{- include "innby.labels" $games | nindent 4 }}
  {{- with $route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml $route.parentRefs | nindent 4 }}
  hostnames:
    - {{ (urlParse (include "innby.gamesUrl" .)).hostname | quote }}
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: {{ include "innby.component" $games }}
          port: {{ .Values.games.service.port }}
{{- end }}
{{- end }}
