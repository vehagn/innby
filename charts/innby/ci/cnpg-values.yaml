# A CloudNativePG Cluster made by the chart, with both kinds of network policy.
siteUrl: https://fest.example.com
controller: { name: Kari Nordmann, email: kari@example.com }
database:
  cnpg:
    create: true
    imageName: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie
    storage: { size: 1Gi, storageClass: proxmox-csi }
    parameters: { timezone: Europe/Oslo }
    annotations: { helm.sh/resource-policy: keep }
    spec: { primaryUpdateStrategy: unsupervised }
secrets: { existingSecret: innby }
mailer:
  from: Innby <fest@example.com>
  smtpUrl: smtp://smtp.example.com:587?tls=required
networkPolicy: { enabled: true }
ciliumNetworkPolicy: { enabled: true }
