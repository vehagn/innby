# Mails. Each is plain text; `{url}` is a link on the site and `{title}` the event.
[mail]
# Under every mail. `{base}` is the site's address.
footer = """
Du får denne e-posten fordi adressa vart lagd til på {base}. Du kan fjerne ho frå sida \
di når som helst."""

# To an address a guest typed in, before it's confirmed. Anyone can type in
# any address, so this mail must not include anything a guest wrote, such as `{name}`.
[mail.confirm_email]
subject = "Stadfest e-postadressa di – {title}"
body = """
Hei!

Opne lenkja og trykk «Stadfest» for å få påminningar og lenkja di til {title} på e-post:

{url}

Lenkja verkar i 48 timar. Var det ikkje deg, kan du sjå bort frå denne e-posten. Då blir \
adressa sletta automatisk."""

# To the confirmed owner when someone else adds their address.
[mail.email_in_use]
subject = "E-postadressa di er allereie registrert – {title}"
body = """
Hei!

Nokon, kanskje deg, prøvde å leggje til denne e-postadressa på eit svar til {title}, men \
ho er allereie i bruk. Har du mista lenkja di, kan du få ho tilsend her:

{url}

Var det ikkje deg, kan du sjå bort frå denne e-posten."""

# The guest's own link, after confirming or from /lost.
[mail.rsvp_link]
subject = "Lenkja di – {title}"
body = """
Hei, {name}!

Her er den personlege lenkja di til {title}. Bruk ho for å endre eller slette svaret ditt:

{url}

Ikkje del lenkja med andre."""

# From the host's Send reminders. `{when}`, `{place}`, `{answer}`.
[mail.reminder]
subject = "Påminning: {title}"
body = """
Hei, {name}!

Ei påminning om {title}: {when}, {place}.

Svaret ditt: {answer}. Endre det her:

{url}"""
