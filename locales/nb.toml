# A sign-up through a group's link.
source_group = "påmelding: {group}"
email_unconfirmed = "ubekreftet"
email_confirmed = "bekreftet"
listed_full = "fullt navn"
listed_partial = "fornavn og initial"
listed_hidden = "ikke på listen"

# Errors
error_party_size = "Antall personer må være mellom 1 og {max}."
error_name = "Skriv navnet med bokstaver, mellomrom og eventuelt - ' . , &, opptil 100 tegn."
error_group_name = "Skriv gruppenavnet med bokstaver, tall, mellomrom og eventuelt - ' . , &, opptil 100 tegn."
# A line of a batch that needs fixing.
error_line = "Linje {n}: {error}"
error_no_names = "Skriv inn minst ett navn."
error_confirm_delete = "Kryss av i boksen for å bekrefte slettingen."
error_group_in_use = "Noen har meldt seg på via denne gruppen, så den kan ikke slettes."
error_qr_color = "Velg en mørkere farge, så telefoner kan lese koden."
error_qr_emoji = "Skriv inn én emoji til midten."

# Mails. Each is plain text; `{url}` is a link on the site and `{title}` the event.
[mail]
# Under every mail. `{base}` is the site's address.
footer = """
Du får denne e-posten fordi adressen ble lagt til på {base}. Du kan fjerne den fra siden \
din når som helst."""
# After a reminder, when the event is attached for the guest's calendar.
calendar_attached = "Arrangementet ligger ved som en kalenderfil, så du kan legge det til i kalenderen din."

# To an address a guest typed in, before it's confirmed. Anyone can type in
# any address, so this mail must not include anything a guest wrote, such as `{name}`.
[mail.confirm_email]
subject = "Bekreft e-postadressen din – {title}"
body = """
Hei!

Åpne lenken og trykk «Bekreft» for å få påminnelser og lenken din til {title} på e-post:

{url}

Lenken virker i 48 timer. Var det ikke deg, kan du se bort fra denne e-posten. Da \
slettes adressen automatisk."""

# To the confirmed owner when someone else adds their address.
[mail.email_in_use]
subject = "E-postadressen din er allerede registrert – {title}"
body = """
Hei!

Noen, kanskje deg, prøvde å legge til denne e-postadressen på et svar til {title}, men \
den er allerede i bruk. Har du mistet lenken din, kan du få den tilsendt her:

{url}

Var det ikke deg, kan du se bort fra denne e-posten."""

# The guest's own link, after confirming or from /lost.
[mail.rsvp_link]
subject = "Lenken din – {title}"
body = """
Hei, {name}!

Her er din personlige lenke til {title}. Bruk den for å endre eller slette svaret ditt:

{url}

Ikke del lenken med andre."""

# From the host's Send reminders. `{when}`, `{place}`, `{answer}`.
[mail.reminder]
subject = "Påminnelse: {title}"
body = """
Hei, {name}!

En påminnelse om {title}: {when}, {place}.

Svaret ditt: {answer}. Endre det her:

{url}"""

# When the host changes the event's start, end or place. `{when}`, `{place}`, `{answer}`.
[mail.event_changed]
subject = "Endring: {title}"
body = """
Hei, {name}!

{title} er endret: Nå er det {when}, {place}.

Svaret ditt: {answer}. Endre det her om du må:

{url}"""
