decline = "Regretfully, I cannot"
reply_by = "Kindly reply by {deadline}"
answers_closed = """
The time for replies has passed. Do contact the host should anything have changed."""
change_name = "Amend name"
data_heading = "Your particulars"
data_text = "You may download everything we hold about you, or delete it forthwith."
delete_confirm = "Yes, delete my reply and everything held about me"
save_link_title = "Do keep your link safe!"
