# British English, the "traditional" variant, with a touch of polish: only the texts it
# says differently from plain English.
# A language is a module: it needs only the texts it has, and one left out here comes
# from the `fallback` languages, in order, and from theirs in turn, down to English,
# the base. A text English doesn't have is refused.
# `{name}` and the like are filled in; keep them as they are.

# What the language is: its own name on the language switch, its tag for <html lang>,
# its mark in the language menu, its locale for day and month names, the
# Accept-Language tags it answers (a tag loses a part at a time until one matches), and
# the languages that fill in what this file leaves out.
language.name = "English (Traditional)"
language.tag = "en-GB"
language.badge = "GB"
language.locale = "en_GB"
language.serves = ["en-gb"]
language.fallback = ["en"]

theme_auto = "As one's device prefers"
theme_light = "Daylight"
theme_dark = "Evening dress"

# Event
# `chrono` format for dates and times: "Saturday 12 December 2026 at 7.00 pm".
date_format = "%A %-d %B %Y at %-I.%M %P"
# The same for a time alone, when an event ends on the day it starts.
time_format = "%-I.%M %P"
when_until = "{start} until {end}"
place = "Venue"
# The front page, which is about Innby rather than any one event.
site_intro = "Innby is where you reply to an invitation: whether you shall attend, and with how many. No account is needed, and everything is deleted 30 days after the event."
rsvp_hint = "Received an invitation? Kindly reply using the link that came with it."

# RSVP page
greeting = "Good day, {name}!"
# Shown until the guest has answered: what we store and why (GDPR Art. 13/14).
first_visit_notice = """
You are cordially invited! To plan the occasion, we keep your name, your reply and the \
size of your party. Nothing more, and every last bit is deleted 30 days after the event. \
On the guest list, other guests see your first name and initial, and you may choose what \
they see."""
keep_link = """
This page is yours alone. Do keep the link should you wish to change your reply, and \
kindly don't share it."""
# The tabs of a guest's pages, and what the bar is called for screen readers.
tab_reply = "Your reply"
changed_notice = "The time or place has changed since you replied. Kindly check it above, and change your reply should you need to."
# The event for the guest's own calendar, once they're coming: a button and a hint.
calendar_hint = "A file with the time and place for your phone's or computer's calendar. Should the plans change, add it again."
add_to_calendar = "Add to my calendar"
saved = "Splendid, all saved."
your_answer = "Your reply: {answer}"
