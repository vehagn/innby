# Traditional Chinese texts for the public site, the admin pages and the mails.
# A language is a module: it needs only the texts it has, and one left out here comes
# from the `fallback` languages, in order, and from theirs in turn, down to English,
# the base. A text English doesn't have is refused.
# `{name}` and the like are filled in; keep them as they are.

# What the language is: its own name on the language switch, its tag for <html lang>,
# its mark in the language menu, its locale for day and month names, the
# Accept-Language tags it answers (a tag loses a part at a time until one matches), and
# the languages that fill in what this file leaves out.
language.name = "繁體中文"
language.tag = "zh-Hant"
language.badge = "繁"
language.locale = "zh_TW"
language.serves = ["zh-hant", "zh-tw", "zh-hk", "zh-mo"]
language.fallback = ["zh-hans"]

