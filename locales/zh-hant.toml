# Mails. Each is plain text; `{url}` is a link on the site and `{title}` the event.
[mail]
# Under every mail. `{base}` is the site's address.
footer = "你收到這封郵件，是因為有人在 {base} 上新增了這個地址。你可以隨時在回覆頁面上刪除它。"
# After a reminder, when the event is attached for the guest's calendar.
calendar_attached = "活動已作為行事曆檔案附上，你可以把它加入自己的行事曆。"

# To an address a guest typed in, before it's confirmed. Anyone can type in
# any address, so this mail must not include anything a guest wrote, such as `{name}`.
[mail.confirm_email]
subject = "確認你的電子郵件地址 – {title}"
body = """
你好！

開啟連結並點擊「確認」，即可透過電子郵件接收 {title} 的提醒和你的連結：

{url}

連結 48 小時內有效。如果不是你本人操作，請忽略這封郵件，該地址會被自動刪除。"""

# To the confirmed owner when someone else adds their address.
[mail.email_in_use]
subject = "你的電子郵件地址已被登記 – {title}"
body = """
你好！

有人（也許是你）試圖把這個電子郵件地址新增到 {title} 的一份回覆中，但該地址已在使用。如果你弄丟了連結，\
可以在這裡重新取得：

{url}

如果不是你本人操作，請忽略這封郵件。"""

# The guest's own link, after confirming or from /lost.
[mail.rsvp_link]
subject = "你的連結 – {title}"
body = """
{name}，你好！

這是你參加 {title} 的個人連結，可用來修改或刪除你的回覆：

{url}

請勿將連結分享給他人。"""

# From the host's Send reminders. `{when}`, `{place}`, `{answer}`.
[mail.reminder]
subject = "提醒：{title}"
body = """
{name}，你好！

提醒你 {title}：{when}，{place}。

你的回覆：{answer}。在這裡修改：

{url}"""

# When the host changes the event's start, end or place. `{when}`, `{place}`, `{answer}`.
[mail.event_changed]
subject = "變更：{title}"
body = """
{name}，你好！

{title} 有變更：現在是 {when}，{place}。

你的回覆：{answer}。如需修改，請點這裡：

{url}"""

[mail.password_reset]
subject = "Innby 的新密碼"
body = """
{name}，你好：

有人（也許是你）為你的 Innby 登入申請了新密碼。打開連結來設定新密碼；連結在 {hours} 小時內有效，只能使用一次：

{url}

如果不是你本人申請，請忽略這封郵件；你的密碼保持不變。"""

[mail.password_set]
subject = "你的 Innby 登入"
body = """
{name}，你好：

管理員為你建立了一個 Innby 登入（主人使用的回覆網站後台），使用者名稱為 {name}。打開連結來設定你的密碼；連結在 {days} 天內有效，只能使用一次：

{url}

如果你沒有預料到這封郵件，請忽略它。"""
