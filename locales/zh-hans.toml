# Mails. Each is plain text; `{url}` is a link on the site and `{title}` the event.
[mail]
# Under every mail. `{base}` is the site's address.
footer = "你收到这封邮件，是因为有人在 {base} 上添加了这个地址。你可以随时在回复页面上删除它。"

# To an address a guest typed in, before it's confirmed. Anyone can type in
# any address, so this mail must not include anything a guest wrote, such as `{name}`.
[mail.confirm_email]
subject = "确认你的电子邮件地址 – {title}"
body = """
你好！

打开链接并点击“确认”，即可通过电子邮件接收 {title} 的提醒和你的链接：

{url}

链接 48 小时内有效。如果不是你本人操作，请忽略这封邮件，该地址会被自动删除。"""

# To the confirmed owner when someone else adds their address.
[mail.email_in_use]
subject = "你的电子邮件地址已被登记 – {title}"
body = """
你好！

有人（也许是你）试图把这个电子邮件地址添加到 {title} 的一份回复中，但该地址已在使用。如果你弄丢了链接，\
可以在这里重新获取：

{url}

如果不是你本人操作，请忽略这封邮件。"""

# The guest's own link, after confirming or from /lost.
[mail.rsvp_link]
subject = "你的链接 – {title}"
body = """
{name}，你好！

这是你参加 {title} 的个人链接，可用来修改或删除你的回复：

{url}

请勿将链接分享给他人。"""

# From the host's Send reminders. `{when}`, `{place}`, `{answer}`.
[mail.reminder]
subject = "提醒：{title}"
body = """
{name}，你好！

提醒你 {title}：{when}，{place}。

你的回复：{answer}。在这里修改：

{url}"""
