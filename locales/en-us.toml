# Mails. Each is plain text; `{url}` is a link on the site and `{title}` the event.
[mail]
# Under every mail. `{base}` is the site's address.
footer = """
You got this email because this address was added on {base}. Remove it from your RSVP \
page anytime."""
# After a reminder, when the event is attached for the guest's calendar.
calendar_attached = "The event is attached as a calendar file, so you can add it to your calendar."

# To an address a guest typed in, before it's confirmed. Anyone can type in
# any address, so this mail must not include anything a guest wrote, such as `{name}`.
[mail.confirm_email]
subject = "Confirm your email – {title}"
body = """
Hi!

Open the link and press "Confirm" to get reminders and your link for {title}:

{url}

It works for 48 hours. Not you? Ignore this email and we'll delete the address."""

# To the confirmed owner when someone else adds their address.
[mail.email_in_use]
subject = "Your email is already signed up – {title}"
body = """
Hi!

Someone (maybe you) tried to add this email to an RSVP for {title}, but it's already in \
use. Lost your link? Get it here:

{url}

Not you? Ignore this email."""

# The guest's own link, after confirming or from /lost.
[mail.rsvp_link]
subject = "Your link – {title}"
body = """
Hi, {name}!

Here's your link for {title}. Use it to change or delete your RSVP:

{url}

Don't share it."""

# From the host's Send reminders. `{when}`, `{place}`, `{answer}`.
[mail.reminder]
subject = "Reminder: {title}"
body = """
Hi, {name}!

{title} is {when} at {place}.

Your answer: {answer}. Change it here:

{url}"""

# When the host changes the event's start, end or place. `{when}`, `{place}`, `{answer}`.
[mail.event_changed]
subject = "Update: {title}"
body = """
Hi, {name}!

{title} has changed. It's now {when} at {place}.

Your answer: {answer}. Change it here if you need to:

{url}"""
