# English texts for the public site, the admin pages and the mails: plain British
# English, with the 24-hour clock.
# English is the base language: every other language falls back to it in the end, so
# this file has every text and falls back to nothing.
# `{name}` and the like are filled in; keep them as they are.

# What the language is: its own name on the language switch, its tag for <html lang>,
# its mark in the language menu, its locale for day and month names, the
# Accept-Language tags it answers (a tag loses a part at a time until one matches), and
# the languages that fill in what this file leaves out.
language.name = "English"
language.tag = "en"
language.badge = "EN"
language.locale = "en_GB"
language.serves = ["en"]

# What the language switch is, for screen readers.
languages = "Languages"
