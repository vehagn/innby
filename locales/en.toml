email_unconfirmed = "unconfirmed"
email_confirmed = "confirmed"
listed_full = "full name"
listed_partial = "first name and initial"
listed_hidden = "not listed"

# Errors
error_party_size = "The party size must be between 1 and {max}."
error_name = "Write the name in letters and spaces, with - ' . , & if need be, up to 100 characters."
error_group_name = "Write the group's name in letters, digits and spaces, with - ' . , & if need be, up to 100 characters."
# A line of a batch that needs fixing.
error_line = "Line {n}: {error}"
error_no_names = "Enter at least one name."
error_confirm_delete = "Tick the box to confirm the deletion."
error_group_in_use = "People have signed up through this group, so it can't be deleted."
error_qr_color = "Pick a darker colour, so phones can read the code."
error_qr_emoji = "Enter one emoji to put in the middle."

# Mails. Each is plain text; `{url}` is a link on the site and `{title}` the event.
[mail]
# Under every mail. `{base}` is the site's address.
footer = """
You get this e-mail because the address was added on {base}. You can remove it from your \
page at any time."""
# After a reminder, when the event is attached for the guest's calendar.
calendar_attached = "The event is attached as a calendar file, to add to your calendar."

# To an address a guest typed in, before it's confirmed. Anyone can type in
# any address, so this mail must not include anything a guest wrote, such as `{name}`.
[mail.confirm_email]
subject = "Confirm your e-mail address – {title}"

body = """
Hello,

Open the link and press "Confirm" to get reminders and your link for {title} by e-mail:

{url}

The link works for 48 hours. If this wasn't you, ignore this e-mail; the address is \
deleted automatically."""

# To the confirmed owner when someone else adds their address.
[mail.email_in_use]
subject = "Your e-mail address is already registered – {title}"

body = """
Hello,

Someone, perhaps you, tried to add this e-mail address to an answer for {title}, but \
it's already in use. If you've lost your link, you can have it sent here:

{url}

If this wasn't you, ignore this e-mail."""

# The guest's own link, after confirming or from /lost.
[mail.rsvp_link]
subject = "Your link – {title}"

body = """
Hello, {name},

Here is your personal link for {title}. Use it to change or delete your answer:

{url}

Don't share it with anyone."""

# From the host's Send reminders. `{when}`, `{place}`, `{answer}`.
[mail.reminder]
subject = "Reminder: {title}"

body = """
Hello, {name},

A reminder of {title}: {when}, {place}.

Your answer: {answer}. To change it:

{url}"""

# When the host changes the event's start, end or place. `{when}`, `{place}`, `{answer}`.
[mail.event_changed]
subject = "{title} has changed"

body = """
Hello, {name},

{title} has changed: it is now {when}, {place}.

Your answer: {answer}. To change it:

{url}"""
