# Mails. Each is plain text; `{url}` is a link on the site and `{title}` the event.
[mail]
# Under every mail. `{base}` is the site's address.
footer = """
You are receiving this e-mail because the address was added on {base}. You may remove it \
from your RSVP page at any time."""

# To an address a guest typed in, before it's confirmed. Anyone can type in
# any address, so this mail must not include anything a guest wrote, such as `{name}`.
[mail.confirm_email]
subject = "Kindly confirm your e-mail address – {title}"
body = """
Good day,

Do open the link and press "Confirm" to receive reminders and your link for {title} by \
e-mail:

{url}

The link remains valid for 48 hours. If this was not you, kindly disregard this e-mail; \
the address shall be deleted automatically."""

# To the confirmed owner when someone else adds their address.
[mail.email_in_use]
subject = "Your e-mail address is already registered – {title}"
body = """
Good day,

Someone, perhaps yourself, attempted to add this e-mail address to a reply for {title}, \
but it is already in use. Should you have mislaid your link, you may have it sent to you \
here:

{url}

If this was not you, kindly disregard this e-mail."""

# The guest's own link, after confirming or from /lost.
[mail.rsvp_link]
subject = "Your link – {title}"
body = """
Good day, {name},

Herewith your personal link for {title}. Do use it to change or withdraw your reply:

{url}

Kindly share it with no one."""

# From the host's Send reminders. `{when}`, `{place}`, `{answer}`.
[mail.reminder]
subject = "A gentle reminder: {title}"
body = """
Good day, {name},

A gentle reminder of {title}: {when}, {place}.

Your reply: {answer}. Should you wish to change it:

{url}"""
